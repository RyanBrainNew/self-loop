name: self-loop

# Copy this file to .github/workflows/self-loop.yml in the target repository.
# The target project still owns .self-loop.json, memory/, and its executor.
on:
  issues:
    types: [opened, reopened, labeled, unlabeled, assigned, closed]
  pull_request:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: self-loop-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RyanBrainNew/self-loop
          path: .self-loop-skill
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post event and tick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SELF_LOOP_REPO: ${{ github.workspace }}
        run: node .self-loop-skill/adapters/github-actions/event.mjs
